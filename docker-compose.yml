      #build:
      #context: ./backend
      #dockerfile: Dockerfile
      #container_name: megaproject_api
      #restart: unless-stopped
      #ports:
      # - "8000:8000"
      #environment:
      # - DATABASE_URL=postgresql://postgres:kitcoek@postgres:5432/career_intel
      #- KEYCLOAK_SERVER_URL=http://keycloak:8080
