services:
  postgres:
    image: postgres:15-alpine
    container_name: career_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: career_intel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kitcoek
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: career_auth
    restart: unless-stopped
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/career_intel
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: kitcoek
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    depends_on:
      - postgres

