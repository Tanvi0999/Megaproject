<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile | StudentPath AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{brand:{navy:'#142B4F',grey:'#F3F5F8',blue:'#4F83CC',slate:'#64748B',border:'#E2E8F0'}},fontFamily:{heading:['Space Grotesk','sans-serif'],sans:['Inter','sans-serif']}}}}</script>
</head>
<body class="bg-brand-grey text-slate-800 font-sans min-h-screen">
<header class="bg-brand-navy text-white px-6 py-5 flex items-center justify-between">
<div><div class="font-heading font-bold text-xl">StudentPath AI</div><div class="text-xs text-blue-200">Complete Student Profile</div></div>
<a href="/teacher" class="text-sm border border-white/30 rounded-lg px-4 py-2 hover:bg-white/10">← Back to Dashboard</a>
</header>
<main class="max-w-6xl mx-auto p-5 md:p-8">
<div id="status" class="bg-white rounded-xl p-5 shadow-sm text-sm text-slate-600">Loading student profile…</div>
<div id="profile" class="hidden space-y-6">
<section class="bg-white rounded-2xl p-6 shadow-sm flex flex-wrap items-center gap-5">
<div class="w-16 h-16 rounded-full bg-blue-50 text-brand-navy flex items-center justify-center text-2xl"><span class="material-symbols-outlined">person</span></div>
<div class="flex-1"><h1 id="student-name" class="font-heading text-2xl font-bold text-brand-navy">Student</h1><p id="student-meta" class="text-sm text-slate-500 mt-1"></p></div>
<span id="student-id" class="text-xs bg-slate-100 rounded-full px-3 py-1"></span>
</section>
<div class="grid md:grid-cols-2 gap-5">
<section class="bg-white rounded-xl p-5 shadow-sm"><h2 class="font-heading font-bold text-brand-navy text-lg mb-4">Attendance</h2><div id="attendance-data" class="text-sm text-slate-600">Not available</div></section>
<section class="bg-white rounded-xl p-5 shadow-sm"><h2 class="font-heading font-bold text-brand-navy text-lg mb-4">Marks & Exam Performance</h2><div id="marks-data" class="text-sm text-slate-600">Not available</div></section>
<section class="bg-white rounded-xl p-5 shadow-sm"><h2 class="font-heading font-bold text-brand-navy text-lg mb-4">Career Recommendations</h2><div id="career-data" class="text-sm text-slate-600">Not available</div></section>
<section class="bg-white rounded-xl p-5 shadow-sm"><h2 class="font-heading font-bold text-brand-navy text-lg mb-4">Skill-gap Analysis</h2><div id="skills-data" class="text-sm text-slate-600">Not available</div></section>
</div></div>
</main>
<script>
const API=(window.StudentPathAPI?.API_BASE_URL)||'http://127.0.0.1:8000';
const token=localStorage.getItem('access_token')||sessionStorage.getItem('access_token')||'';
const id=new URLSearchParams(location.search).get('id');
const status=document.getElementById('status');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showValue(value){
 if(value===null||value===undefined||value==='') return '<p class="text-slate-400">Not available</p>';
 if(Array.isArray(value)) return value.length?'<ul class="list-disc pl-5 space-y-1">'+value.map(x=>'<li>'+esc(typeof x==='object'?JSON.stringify(x):x)+'</li>').join('')+'</ul>':'<p class="text-slate-400">Not available</p>';
 if(typeof value==='object') return '<dl class="grid sm:grid-cols-2 gap-3">'+Object.entries(value).map(([k,v])=>'<div><dt class="text-xs uppercase tracking-wide text-slate-400">'+esc(k.replaceAll('_',' '))+'</dt><dd class="font-medium text-slate-700 mt-1">'+esc(typeof v==='object'?JSON.stringify(v):v)+'</dd></div>').join('')+'</dl>';
 return '<p>'+esc(value)+'</p>';
}
async function load(){
 if(!id){status.textContent='No student ID was supplied. Return to the teacher dashboard and select a student.';return;}
 try{
  const r=await fetch(`${API}/api/students/${encodeURIComponent(id)}`,{headers:token?{Authorization:`Bearer ${token}`}:{}}); 
  if(!r.ok) throw new Error(r.status===404?'Student profile was not found.':`Could not load profile (HTTP ${r.status}).`);
  const d=await r.json(); const student=d.student||d.profile||d;
  document.getElementById('student-name').textContent=student.name||student.full_name||student.student_name||'Student Profile';
  document.getElementById('student-meta').textContent=[student.email,student.department||student.branch,student.year,student.division].filter(Boolean).join(' • ')||'Student details';
  document.getElementById('student-id').textContent='ID: '+(student.id||student.student_id||id);
  document.getElementById('attendance-data').innerHTML=showValue(student.attendance||student.attendance_data||student.attendance_prediction);
  document.getElementById('marks-data').innerHTML=showValue(student.marks||student.exam_performance||student.marks_prediction);
  document.getElementById('career-data').innerHTML=showValue(student.recommendations||student.career_recommendations||student.career);
  document.getElementById('skills-data').innerHTML=showValue(student.skill_gap||student.skills||student.skill_gap_analysis);
  document.getElementById('profile').classList.remove('hidden'); status.classList.add('hidden');
 }catch(e){status.textContent=e.message+' Check that the FastAPI backend is running and the API URL is configured.';}
}
load();
</script></body></html>
